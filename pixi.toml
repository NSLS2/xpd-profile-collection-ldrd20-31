[project]
channels = ["conda-forge"]
name = "ZMQ-Autonomous"
platforms = ["linux-64"]
version = "2025-3.0"

[system-requirements]
libc = "2.17"

[feature.profile.dependencies]
bluesky-base = "==1.14.4"
bluesky-queueserver = "*"
bluesky-queueserver-api = "*"
matplotlib-base= ">=3.9.3,<4"
networkx = ">=3.4.2,<4"
nslsii = "==0.11.4"
numpy = "*"
ophyd = "==1.11.0"
pyepics = "*"
python = ">=3.12,<3.13"
semver = ">=3.0.4,<4"
colorlog = ">=6.9.0,<7"
xpdan = ">=0.8.2,<0.9"
#xpdacq = ">=1.1.4,<2"
#xpdacq = "==1.0.0"
databroker = "==2.0.0b68"
bluesky-tiled-plugins = ">=2.0.0b67"
lmfit = ">=1.3.4,<2"
bluesky-darkframes = ">=0.6.0,<0.7"
hdf5-external-filter-plugins = ">=0.1.0,<0.2"
blosc-hdf5-plugin = ">=1.0.1,<2"
pydantic-numpy = ">=8.0.0,<9"
p4p = ">=4.2.0,<5"
epicscorelibs = ">=7.0.7.99.1.1,<8"
tiled-client = ">=0.2.3,<0.3"
pymatgen = "*"
"diffpy.pdffit2" = "*"
"diffpy.structure" = "*"
#setuptools = "<81"
#httpie = "*"



[feature.profile.pypi-dependencies]
ophyd-async = { version = ">0.10.0", extras = ["ca", "pva"] }
#"diffpy.pdfgetx" = { path = "/nsls2/data/xpd-new/legacy/processed/pdfgetx-2.4.0/diffpy_pdfgetx-2.4.0-cp312-cp312-linux_x86_64.whl" }
#pdfstream = { git = "https://github.com/NSLS-II-PDF/pdfstream.git", rev="v0.5.x-xpd-datasec" }
#torch = { version = "*", index = "https://download.pytorch.org/whl/cu124" }
